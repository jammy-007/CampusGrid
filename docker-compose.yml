services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusgrid
      POSTGRES_PASSWORD: campusgrid
      POSTGRES_DB: campusgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
